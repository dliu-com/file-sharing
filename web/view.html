<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>DL Share</title>
  <link rel="icon" href="/_app/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/_app/style.css">
  <script type="module" src="/_app/view.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img class="logo" src="/_app/logo.svg" alt=""><span class="name">DL Share</span></a>
  </header>
  <main>
    <nav class="crumbs" id="crumbs" aria-label="Folder" data-i18n-label="folder"></nav>
    <p class="muted" id="status" data-i18n="loading">Loading…</p>
    <section id="folder" hidden>
      <table class="files">
        <thead><tr><th data-i18n="name">Name</th><th class="size" data-i18n="size">Size</th><th class="date" data-i18n="modified">Modified</th><th class="actions"><span class="visually-hidden" data-i18n="download">Download</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="muted small" id="empty" hidden data-i18n="empty">This folder is empty.</p>
    </section>
    <section id="file" hidden>
      <div class="file-head">
        <div>
          <h1 id="file-name"></h1>
          <p class="muted" id="file-meta"></p>
        </div>
        <div class="row">
          <a class="button primary" id="file-download" download>⬇ <span data-i18n="download">Download</span></a>
          <a class="button" id="file-open" target="_blank" rel="noopener" data-i18n="open">Open</a>
        </div>
      </div>
      <div class="preview" id="preview"></div>
      <nav class="row spread pager" id="pager" hidden>
        <a class="button" id="prev" data-i18n="previous">← Previous</a>
        <a class="button" id="next" data-i18n="next">Next →</a>
      </nav>
    </section>
  </main>
  <footer class="bottom"><span data-i18n="sharedVia">Shared via</span> <a href="https://dliu.com">dliu.com</a></footer>
</body>
</html>
